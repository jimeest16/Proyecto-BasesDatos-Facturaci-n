
spring.application.name=facturacion


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SistemaFacturacionEmpresaPropi;encrypt=true;trustServerCertificate=true

# Usuario y contrasena de SQL Server
spring.datasource.username=usr_digitador
spring.datasource.password=DigitadorPass123

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Desactivar verificacion de plantillas Thymeleaf
spring.thymeleaf.check-template-location=false

# Logs
spring.main.banner-mode=off
logging.level.root=warn
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.orm.jdbc.bind=trace

# Puerto y contexto de Spring Boot
server.servlet.context-path=/facturacion
server.port=8084
