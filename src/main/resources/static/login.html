<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Facturación</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

   
        .glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: #6366f1;
            filter: blur(120px);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            opacity: 0.5;
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #06b6d4;
            filter: blur(120px);
            border-radius: 50%;
            bottom: 15%;
            right: 20%;
            opacity: 0.5;
        }

     
        .contenedor {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 40px 35px;
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .header-login {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-login h1 {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-login p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(6, 182, 212, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #334155;
            box-shadow: none;
            cursor: wait;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="contenedor">
        <div class="header-login">
            <h1>Facturación</h1>
            <p>Ingresa tus credenciales de acceso</p>
        </div>

        <form id="formularioLogin">
            <div class="campo">
                <label for="usuario">Usuario SQL</label>
                <input id="usuario" type="text" autocomplete="username" placeholder="usuario_admin" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button id="botonLogin" type="submit">
                Entrar al Sistema
            </button>
        </form>

        <p id="mensaje" role="status"></p>
    </div>

    <script>
        const formulario = document.getElementById("formularioLogin");
        const mensaje = document.getElementById("mensaje");
        const botonLogin = document.getElementById("botonLogin");

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            mensaje.textContent = "Validando credenciales...";
            botonLogin.disabled = true;

            const usuario = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value;

            try {
                const respuesta = await fetch(
                    "/facturacion/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            usuario: usuario,
                            contrasena: contrasena
                        })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.autenticado) {
                    mensaje.textContent =
                        datos.mensaje || "Usuario o contraseña incorrectos.";
                    return;
                }

                if (datos.rol === "Rol_Digitador") {
                    window.location.href = "/facturacion/digitador.html";

                } else if (datos.rol === "Rol_Consulta") {
                    window.location.href = "/facturacion/consulta.html";

                } else if (datos.rol === "Rol_Admin") {
                    window.location.href = "/facturacion/admin.html";
                }
            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";
            } finally {
                botonLogin.disabled = false;
            }
        });
    </script>

</body>

</html>
