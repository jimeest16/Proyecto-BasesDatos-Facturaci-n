<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Facturación Propi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f4f3f0;
            --panel-bg: #fcfbf9;
            --text-heading: #2d2b2a;
            --text-body: #57534e;
            --accent-terracotta: #dd6b53;
            --accent-sage: #5b8a72;
            --accent-lavender: #8b78a5;
            --border-soft: #d6d1c4;
            --card-shadow: 0 12px 32px rgba(45, 43, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: var(--panel-bg);
            border: 1.5px solid var(--border-soft);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
        }

        .header-login {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            width: 12px;
            height: 12px;
            background: var(--accent-terracotta);
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 8px;
        }

        .header-login h1 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-heading);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-login p {
            color: var(--text-body);
            font-size: 0.88rem;
            margin-top: 6px;
        }

        .campo {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-heading);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #f5f4f0;
            border: 1.5px solid var(--border-soft);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            color: var(--text-heading);
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #a8a29e;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--accent-lavender);
            box-shadow: 0 0 0 4px rgba(139, 120, 165, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--text-heading);
            color: #fcfbf9;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-sage);
            box-shadow: 0 4px 14px rgba(91, 138, 114, 0.25);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--border-soft);
            color: #a8a29e;
            cursor: wait;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.88rem;
            color: var(--accent-terracotta);
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="header-login">
            <span class="brand-badge"></span>
            <h1>Propi Facturación</h1>
            <p>Ingresa tus credenciales de acceso</p>
        </div>

        <form id="formularioLogin">
            <div class="campo">
                <label for="usuario">Usuario SQL</label>
                <input id="usuario" type="text" autocomplete="username" placeholder="usuario_admin" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button id="botonLogin" type="submit">
                Entrar al Sistema
            </button>
        </form>

        <p id="mensaje" role="status"></p>
    </div>

    <script>
        const formulario = document.getElementById("formularioLogin");
        const mensaje = document.getElementById("mensaje");
        const botonLogin = document.getElementById("botonLogin");

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            mensaje.style.color = "var(--accent-lavender)";
            mensaje.textContent = "Validando credenciales...";
            botonLogin.disabled = true;

            const usuario = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value;

            try {
                const respuesta = await fetch(
                    "/facturacion/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            usuario: usuario,
                            contrasena: contrasena
                        })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.autenticado) {
                    mensaje.style.color = "var(--accent-terracotta)";
                    mensaje.textContent =
                        datos.mensaje || "Usuario o contraseña incorrectos.";
                    return;
                }

                if (datos.rol === "Rol_Digitador") {
                    window.location.href = "/facturacion/digitador.html";
                } else if (datos.rol === "Rol_Consulta") {
                    window.location.href = "/facturacion/consulta.html";
                } else if (datos.rol === "Rol_Admin") {
                    window.location.href = "/facturacion/admin.html";
                }
            } catch (error) {
                mensaje.style.color = "var(--accent-terracotta)";
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";
            } finally {
                botonLogin.disabled = false;
            }
        });
    </script>

</body>

</html>
